<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Galeomorphi Dashboard</title>

<!-- Libraries -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.plot.ly/plotly-3.4.0.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
}

svg{
    margin-bottom:50px;
}

.tooltip{
    position:absolute;
    background:white;
    border:1px solid #ccc;
    padding:6px 10px;
    border-radius:4px;
    pointer-events:none;
    font-size:13px;
    opacity:0;
}
.dashboard{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 30px;
    align-items: start;
}

.column{
    display: flex;
    flex-direction: column;
}
</style>
</head>

<body>

    <!-- LEFT -->
    <div class="dashboard">
        <div class="column">
                <!-- Histogram -->
<h2>Sightings Over Time</h2>
<label>Bin Size:</label>
<input type="range" id="binSlider" min="5" max="50" value="20">
<svg id="histogram" width="700" height="400"></svg>

<!-- Pie Chart -->
<h2>Marine Province Distribution</h2>
<svg id="piechart" width="500" height="400"></svg>
        </div>
    </div>

<h1>Galeomorphi Visualizations Dashboard</h1>

<!-- MIDDLE -->
 <div class = "dashboard">
        <div class="column">
            <!-- Surface Plot -->
<h2>3D Surface Plot</h2>
<div id="surface" style="width:500px;height:500px;"></div>
            </div>
            </div>


 <div class = "dashboard">
        <div class="column">
            <!-- Stacked Bar -->
            <h2>Stacked Distribution</h2>
            <div id="stacked"></div>
            </div>
            </div>


<div id="tooltip" class="tooltip"></div>

<script>

// -------------------- COLORS--------------------
const globalColor = d3.scaleOrdinal(['#46599e','#6d81f1','#c9b4a2', '#722B6A', '#d9915d', '#ad272c']);

// -------------------- TOOLTIP --------------------
const tooltip = d3.select("#tooltip");

function showTooltip(event, html){
    tooltip
        .style("opacity",1)
        .html(html)
        .style("left",(event.pageX+10)+"px")
        .style("top",(event.pageY-20)+"px");
}

function hideTooltip(){
    tooltip.style("opacity",0);
}

// -------------------- DATA --------------------
d3.csv("Galeomorphi_Data.csv").then(data=>{

data.forEach(d=>{
    d.year = +d.year;
    d.isGaleomorphi = +d.isGaleomorphi;
});

// Set shared domain
const marineProvinces = [...new Set(data.map(d=>d.marine_province))];
globalColor.domain(marineProvinces);

// -------------------- HISTOGRAM --------------------
const histSvg = d3.select("#histogram");
const width = +histSvg.attr("width");
const height = +histSvg.attr("height");

const margin={top:20,right:20,bottom:40,left:50};
const innerWidth=width-margin.left-margin.right;
const innerHeight=height-margin.top-margin.bottom;

const values=data.map(d=>d.year);

function draw(binCount){

    histSvg.selectAll("*").remove();

    const chart=histSvg.append("g")
        .attr("transform",`translate(${margin.left},${margin.top})`);

    const x=d3.scaleLinear()
        .domain([1940, d3.max(values)])
        .range([0,innerWidth]);

    const bins=d3.bin()
        .domain(x.domain())
        .thresholds(binCount)(values);

    const y=d3.scaleLinear()
        .domain([0,d3.max(bins,d=>d.length)])
        .range([innerHeight,0]);

    chart.selectAll("rect")
        .data(bins)
        .enter()
        .append("rect")
        .attr("x",d=>x(d.x0))
        .attr("y",d=>y(d.length))
        .attr("width",d=>Math.max(0,x(d.x1)-x(d.x0)-1))
        .attr("height",d=>innerHeight-y(d.length))
        .attr("fill",globalColor(marineProvinces[0]))
        .on("mousemove",(event,d)=>{
            showTooltip(event,
                `<b>Range:</b> ${d.x0} - ${d.x1}<br>Count: ${d.length}`);
        })
        .on("mouseout",hideTooltip);

    chart.append("g")
        .attr("transform","translate(0,"+innerHeight+")")
        .call(d3.axisBottom(x));

    chart.append("g")
        .call(d3.axisLeft(y));
}

draw(20);

d3.select("#binSlider").on("input",function(){
    draw(this.value);
});

// -------------------- PIE CHART --------------------
const pieSvg=d3.select("#piechart")
    .append("g")
    .attr("transform","translate(250,200)");

const summary=d3.rollups(
    data,
    v=>d3.sum(v,d=>d.isGaleomorphi),
    d=>d.marine_province
).map(([marine_province,total])=>({marine_province,total}));

const pie=d3.pie().value(d=>d.total);
const arc=d3.arc().innerRadius(0).outerRadius(150);

pieSvg.selectAll("path")
    .data(pie(summary))
    .enter()
    .append("path")
    .attr("d",arc)
    .attr("fill",d=>globalColor(d.data.marine_province))
    .on("mousemove",(event,d)=>{
        showTooltip(event,
            `<b>${d.data.marine_province}</b><br>${d.data.total}`);
    })
    .on("mouseout",hideTooltip);

});

// -------------------- STACKED BAR --------------------
d3.csv("Galeomorphi_Stacked.csv").then(data=>{

const margin = {top:10,right:30,bottom:20,left:50},
      width = 460 - margin.left - margin.right,
      height = 400 - margin.top - margin.bottom;

const svg = d3.select("#stacked")
  .append("svg")
  .attr("width", width + margin.left + margin.right)
  .attr("height", height + margin.top + margin.bottom)
  .append("g")
  .attr("transform",`translate(${margin.left},${margin.top})`);

const subgroups = data.columns.slice(1);
const groups = data.map(d=>d.group);

const x = d3.scaleBand()
    .domain(groups)
    .range([0,width])
    .padding(0.2);

svg.append("g")
    .attr("transform",`translate(0,${height})`)
    .call(d3.axisBottom(x));

const y = d3.scaleLinear()
    .domain([0,300])
    .range([height,0]);

svg.append("g").call(d3.axisLeft(y));

const stackedData = d3.stack().keys(subgroups)(data);

svg.append("g")
  .selectAll("g")
  .data(stackedData)
  .enter().append("g")
    .attr("fill", d => globalColor(d.key))
  .selectAll("rect")
  .data(d=>d)
  .enter().append("rect")
    .attr("x", d=>x(d.data.group))
    .attr("y", d=>y(d[1]))
    .attr("height", d=>y(d[0]) - y(d[1]))
    .attr("width", x.bandwidth())
    .on("mousemove",(event,d)=>{
        showTooltip(event,`Value: ${d[1]-d[0]}`);
    })
    .on("mouseout",hideTooltip);

});

// -------------------- SURFACE PLOT --------------------
d3.csv("test.csv").then(rows=>{

function unpack(rows, key) {
  return rows.map(row => row[key]);
}

let z_data=[];
for(let i=0;i<20;i++){
  z_data.push(unpack(rows,i));
}

Plotly.newPlot('surface', [{
    z: z_data,
    type: 'surface'
}], {
    title: '3D Surface',
    width:500,
    height:500
});

});

</script>

</body>
</html>
